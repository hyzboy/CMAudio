# 声音事件配置示例（SoundEvent 数据驱动层）
# 一个 [event.xxx] 小节定义一个声音事件；字段缺省使用默认值

[event.shoot]
file = "wav_samples/shoot.wav"
min_gain = 0.8
max_gain = 1.0
min_pitch = 0.95
max_pitch = 1.05
priority = 1.5
bus = "SFX"

[event.explosion]
files = ["wav_samples/explosion1.wav", "wav_samples/explosion2.wav"]
min_gain = 0.9
max_gain = 1.0
reference_distance = 5.0
max_distance = 500.0
rolloff_factor = 1.0
priority = 2.0
bus = "SFX"

[event.bgm]
file = "wav_samples/bgm.ogg"
loop = true
bus = "Music"

[event.ambient_wind]
file = "wav_samples/wind.wav"
loop = true
max_gain = 0.5
max_distance = 200.0
bus = "Ambient"

[event.ui_click]
file = "wav_samples/click.wav"
min_gain = 0.6
max_gain = 0.8
priority = 3.0
bus = "UI"

# ===== T2 扩展字段 =====

# 严格轮播（左右脚步交替）
[event.step_cycle]
sequence = ["wav_samples/step_l.wav", "wav_samples/step_r.wav"]
bus = "SFX"

# 复合 Cue（并行触发子 Cue）
[event.combo_hit]
children = ["hit_body", "hit_voice"]
bus = "SFX"
priority = 4.0

# RTPC：游戏发 SetParam("rpm", v) 驱动引擎音调
[event.engine_rpm]
file = "wav_samples/engine.ogg"
loop = true
bus = "SFX"

[[event.engine_rpm.rtpc]]
param = "rpm"
min = 0.0
max = 8000.0
target = "pitch"
min_value = 0.5
max_value = 2.0

[[event.engine_rpm.rtpc]]
param = "rpm"
min = 0.0
max = 8000.0
target = "lowpass"
min_value = 200.0
max_value = 8000.0

# ===== 混音快照（T2）=====

[snapshots.in_menu]
[snapshots.in_menu.bus_gain]
Music = -6.0
SFX = -3.0
Ambient = -12.0
UI = 0.0

[snapshots.battle]
[snapshots.battle.bus_gain]
Music = -3.0
Ambient = 0.0
UI = -6.0
